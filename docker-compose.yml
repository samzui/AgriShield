services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: crop_insurance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crop_insurance"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crop_insurance
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      SERVER_PORT: 8080
      CORS_ORIGINS: http://localhost:8081,http://172.28.224.1:8081
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports: ["8081:80"]
volumes:
  postgres_data:
