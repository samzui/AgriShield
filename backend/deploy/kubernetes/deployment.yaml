apiVersion: apps/v1
kind: Deployment
metadata:
  name: crop-insurance-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crop-insurance-backend
  template:
    metadata:
      labels:
        app: crop-insurance-backend
    spec:
      containers:
        - name: backend
          image: crop-insurance-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: crop-insurance-secrets
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crop-insurance-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crop-insurance-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crop-insurance-secrets
                  key: jwt-secret
            - name: AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: crop-insurance-secrets
                  key: aes-secret
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: crop-insurance-backend
spec:
  selector:
    app: crop-insurance-backend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crop-insurance-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crop-insurance-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
