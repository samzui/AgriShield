spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update
server:
  ssl:
    enabled: ${TLS_ENABLED:false}
    protocol: TLS
    enabled-protocols: TLSv1.3
    key-store: ${TLS_KEYSTORE:}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${TLS_KEYSTORE_TYPE:PKCS12}
app:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    secret: ${AES_SECRET}
