services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crop_insurance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d crop_insurance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crop_insurance
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: replace-with-a-random-32-byte-secret-in-real-use
      AES_SECRET: replace-with-a-random-32-byte-secret-in-real-use
      CORS_ORIGINS: http://localhost:8081,http://172.28.224.1:8081
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      SERVER_PORT: 8080
      OPERATIONAL_HOURS_ENABLED: "false"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
